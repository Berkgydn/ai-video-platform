services:
  # --- BACKEND (FastAPI) ---
  backend:
    build: ./backend
    container_name: ai_backend
    # GPU'nun aktif olması için restart gerekebilir, o yüzden always diyoruz
    restart: always 
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data/media:/app/media
      - ./ai_models:/app/ai_models
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - ollama # Backend'in Ollama'yı beklemesini sağlar
    networks:
      - ai-network
    # ---> (GPU AKTİVASYONU) <---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 
              capabilities: [gpu]
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

  # --- OLLAMA (Local AI Model) ---
  ollama:
    image: ollama/ollama:latest
    container_name: ai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:  # <-- EKSİKTİ: Backend ile konuşması için bu şart
      - ai-network
    #Google DNS kullan emri ↓
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- FRONTEND (React + Vite) ---
  frontend:
    build: ./frontend
    container_name: ai_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - ai-network

  # --- DATABASE (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    container_name: ai_db
    volumes:
      - ./data/db_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - ai-network

# --- GLOBAL AYARLAR ---
networks:
  ai-network:
    driver: bridge

volumes: 
  ollama_data: